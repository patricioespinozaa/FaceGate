{% extends "base.html" %}

{% block content %}
<div class="student-view">
    <!--Welcome-->
    <div class="welcome-container" style="font-size: 28px;">
        <div>¡Bienvenid@!</div>
        <div> Por favor digita tu rut y presiona enter para poder verificarte.</div>
    </div>

    <div class="main-content">
        <div class="model-container">
            <div class="model-row">

                <!--Ingresar Rut -->
                <div class="input-group-custom">
                    <input type="text" id="rut" inputmode="numeric" style="width: 300px" placeholder="12345678-9">
                </div>

                <!-- Foto capturada -->
                <div style="margin-top: 20px;">
                    <img id="captured-photo" src="" alt="Tu foto se mostrará aquí" style="max-width: 400px; display: none;">
                </div>

                <!-- Mensaje de confirmación -->
                <div id="confirmation-message" style="margin-top: 20px; font-size: 20px;"></div>

            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/rut_sender_student.js') }}"></script>
{% endblock %}
