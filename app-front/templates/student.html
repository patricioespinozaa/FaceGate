{% extends "base.html" %}

{% block content %}
<div class="student-view">
    <!-- Welcome -->
    <div class="welcome-container" style="font-size: 28px;">
        <div>¡Bienvenid@!</div>
        <div> Por favor digita tu RUT y presiona enter, al presionar enter mira a la cámara ¡se tomará tu foto! Luego se mostará el resultado de tu verificación.</div>
    </div>

    <div class="main-content">
        <div class="model-container-s">
            <div class="model-row">

                <!--Ingresar Rut -->
                <div class="input-group-custom">
                    <input type="text" id="rut" style="width: 300px" placeholder="12345678-9">
                </div>

                <!-- Cámara -->
                <div class="box">
                    <div class="box-header">
                        <p class="box-title">Cámara</p>
                    </div>
                    <div class="box-body">
                        <div class="box-body d-flex justify-content-center align-items-center" id="camera-body-student">
                            <video autoplay="true" id="video-stream-student"></video>
                            <img id="captured-photo" style="display: none;" />
                        </div>
                    </div>
                </div>

                <!-- Decisión -->
                <div class="decision-column">
                    <div class="box model-decision" id="decision-box">
                        <div id="access-label">Acércate a la cámara</div>
                    </div>
                    <div id="decision-message" class="decision-message"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/rut_sender_student.js') }}"></script>
<script src="{{ url_for('static', filename='js/camara_student.js') }}"></script>
{% endblock %}
